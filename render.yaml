# Render Blueprint for Closet Craft
# Deploys the existing React + Express + PostgreSQL + FastAPI ML architecture.
databases:
  - name: closet-craft-db
    databaseName: closet_craft
    user: closet_craft_user
    plan: basic-256mb

services:
  - type: web
    name: closet-craft-ml
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 2c-4g
    healthCheckPath: /health

  - type: web
    name: closet-craft-api
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    disk:
      name: closet-craft-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: closet-craft-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: closet-craft-ml
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: FRONTEND_URL
        fromService:
          type: web
          name: closet-craft-web
          property: host

  - type: web
    name: closet-craft-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: closet-craft-api
          property: host
